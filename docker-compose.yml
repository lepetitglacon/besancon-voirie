# Développement local : PostgreSQL 17 + PostGIS 3.5 + pgRouting 4.0
# Nom de projet fixe : tous les checkouts (dépôt principal et worktrees) partagent le même
# conteneur et le même volume. Pas de montage relatif, pour que `docker compose up` lancé
# depuis un worktree ne recrée pas le conteneur. Bases et extensions : `pnpm db:prepare`.
name: besancon-voirie

services:
  db:
    image: pgrouting/pgrouting:17-3.5-4.0.1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voirie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voirie}
      POSTGRES_DB: ${POSTGRES_DB:-voirie}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Éditeur de profils en travers (docs/integration-streetmix.md) : fork de Streetmix avec le pont
  # d'intégration, construit depuis GitHub (ou depuis un clone local : STREETMIX_SRC, chemin
  # absolu). Sa base `streetmix`, dans le conteneur db, est créée et migrée au démarrage ; ce n'est
  # qu'un brouillon : les profils vivent dans la base du projet. `pnpm streetmix:up`.
  streetmix:
    build:
      context: ${STREETMIX_SRC:-https://github.com/lepetitglacon/streetmix.git#integration-voirie}
      args:
        OFFLINE_MODE: "true"
        EMBED_ALLOWED_ORIGINS: '^http://localhost:\d+$$'
    image: besancon-voirie-streetmix
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-voirie}:${POSTGRES_PASSWORD:-voirie}@db:5432/streetmix
      FRAME_ANCESTORS: http://localhost:*
    ports:
      - "${STREETMIX_PORT:-8000}:8000"

volumes:
  db-data:
